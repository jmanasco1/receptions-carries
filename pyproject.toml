[project]
name = "nfl-usage-props"
version = "0.1.0"
description = "Hierarchical usage model for NFL reception and rush-attempt prop markets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nflreadpy>=0.1.5",
    "polars>=1.0.0",
    "pyarrow>=16.0.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "responses>=0.25.0",
    "ruff>=0.6.0",
]

[project.scripts]
nfl-props = "nfl_usage_props.cli:app"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nfl_usage_props"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: test requires live network access (deselect with -m 'not network')",
    "slow: test downloads real nflverse data",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
